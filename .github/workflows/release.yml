name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after npm trusted publishing has been configured
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changesets:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: npm install --global npm@12.2.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm verify
      - run: pnpm size
      - run: pnpm test
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ github.token }}
          version-script: pnpm version-packages
          publish-script: ${{ inputs.publish && 'pnpm release-packages' || '' }}
          commit-message: 'chore: version plugin'
          pr-title: 'chore: version plugin'
          create-github-releases: false
          push-git-tags: false
